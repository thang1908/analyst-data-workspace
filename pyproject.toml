[tool.poetry]
name = "analyst-data-workspace"
version = "0.1.0"
description = "Trusted CSV to Dashboard Platform Workspace"
authors = ["CX Team"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
pydantic = "^2.6.0"
sqlalchemy = "^2.0.25"
psycopg = {version = "^3.1.18", extras = ["binary"]}
alembic = "^1.13.1"
uvicorn = "^0.28.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
mypy = "^1.8.0"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
