version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cx_postgres
    environment:
      POSTGRES_USER: cx_user
      POSTGRES_PASSWORD: cx_password
      POSTGRES_DB: cx_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cx_user -d cx_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
