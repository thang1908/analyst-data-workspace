version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cx_postgres
    environment:
      POSTGRES_DB: cx_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: cx_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/cx_platform
      APP_ENV: staging
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: cx_worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/cx_platform
      APP_ENV: staging
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: cx_web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
