name: Staging Integration Gates

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  integration-suite:
    name: Database Migrations & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cx_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/cx_platform_test
          PYTHONPATH: .
        run: |
          alembic upgrade head

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/cx_platform_test
          PYTHONPATH: .
        run: |
          pytest tests/integration/ -v
