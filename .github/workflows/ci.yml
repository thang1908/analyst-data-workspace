name: CI Fast Gates

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest mypy pydantic fastapi sqlalchemy uvicorn psycopg[binary]

      - name: Python Syntax & Type Checks
        run: |
          python -m py_compile apps/api/src/app.py apps/worker/src/worker.py

      - name: Run Unit & Contract Tests
        run: |
          pytest tests/unit/ -v || true

  web-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Bundle
        run: |
          cd apps/web
          npm ci || npm install
          npm run build || true
