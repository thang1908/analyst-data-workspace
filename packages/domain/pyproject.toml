[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cx-domain"
version = "0.1.0"
description = "Pure Domain Entities and Ports for CX Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cx-contracts"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "mypy>=1.8.0"
]
