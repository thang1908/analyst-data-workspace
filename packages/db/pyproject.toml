[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cx-db"
version = "0.1.0"
description = "Database Access, Models and Migrations for CX Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cx-contracts",
    "cx-domain",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "mypy>=1.8.0"
]
