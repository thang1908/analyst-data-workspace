[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cx-api"
version = "0.1.0"
description = "FastAPI Backend API for CX Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cx-contracts",
    "cx-domain",
    "cx-db",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]
